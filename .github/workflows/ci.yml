name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gocart_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gocart_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gocart_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci # also generates the Prisma client
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      - name: Apply migrations with the Prisma CLI
        run: npx prisma migrate deploy
      - name: Check migrations match schema.prisma
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - name: Seed
        run: npx prisma db seed

      - name: Integration tests (real PostgreSQL)
        run: npm run test:integration

      - run: npm run build
